[protocol]
id = "gse87571-posthoc-dual-probe-latent-v1"
status = "frozen"
scientific_status = "post_hoc_hypothesis_generating"
parent_protocol_id = "gse87571-hg19-caduceus-ps-v2"
parent_protocol_sha256 = "4f62fcc8254519f84cbc9bbb016d8da4ed8c14e7b03bca9b93b8f090ff1a08a7"
data_bundle_sha256 = "0669b85ff68229877b5dba4377342ae35ecdfc2f08a7bdc9fde27bd8f6f2f283"
windows = [1024, 4096]
splits = ["diverse-blocks", "held-out-chromosome"]

[objective]
formula = "L_geometry(u,a) + catch_weight * (alpha * (1-cos(u,stopgrad(z))) + (1-alpha) * (1-cos(stopgrad(u),z)))"
geometry_formula = "mean((u@u.T-Y)^2) + lambda_age * mean((u@a-rho)^2)"
sequence_direct_target_weight = 0.0
catch_weight = 0.1
weight_decay = 0.0

[initialization]
learned_vectors = "iid_standard_normal_then_rowwise_unit_norm"
projection = "bias_free_training_partition_condition_truncated_least_squares_to_random_unit_vectors"
normal_equation_condition_ceiling = 100000000.0
relative_normal_residual_ceiling = 0.00001
maximum_discarded_cross_moment_fraction = 0.005
validation_or_test_rows_allowed = false

[training]
dense_optimizer = "adam"
learned_table_optimizer = "sparse_adam"
batch_size = 512
neighbourhood_width = 1048576
steps = 2000
validation_interval = 100
validation_pair_chunk_size = 512
learning_rate = 0.001
seeds = [851733, 851734, 851735]

[alpha]
fixed = [0.0, 0.25, 0.5, 0.75, 1.0]
schedules = ["linear_0_to_1", "linear_1_to_0"]

[selection]
candidate_score = "mean_over_seeds_of_each_seed_minimum_validation_sequence_pair_mse_plus_age_mse"
checkpoint_score = "validation_sequence_pair_mse_plus_age_mse"
tie_break = "config_order_then_smaller_selected_step"
test_policy = "evaluate_only_the_validation_selected_alpha_strategy_for_each_split_and_window"
refit_partition = "complete_primary_train"

